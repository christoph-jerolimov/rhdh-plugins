name: Build and push plugin image
description: >-
  Build a Red Hat Developer Hub dynamic plugins container image for a workspace
  using the rhdh-cli and (optionally) push it to the container registry.

inputs:
  workspace:
    description: Name of the workspace to build an image for
    required: true
  registry:
    description: Image repository the tags are pushed to (without the tag part)
    required: false
    default: quay.io/rhdh/rhdh-plugins
  tags:
    description: >-
      Newline or space separated list of image tags (the part after the colon).
      The first tag is used to build the image, any additional tags are added
      with `podman tag`. All tags should be prefixed with the workspace name.
    required: true
  labels:
    description: >-
      Newline or space separated list of image labels (key=value), for example
      `quay.expires-after=2w`. Optional.
    required: false
    default: ''
  push:
    description: Whether to push the image to the registry ('true' or 'false')
    required: false
    default: 'false'
  quay_username:
    description: Username used to authenticate against quay.io when pushing
    required: false
    default: ''
  quay_password:
    description: Password or token used to authenticate against quay.io when pushing
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org/ # Needed for auth

    - name: yarn install
      shell: bash
      working-directory: ./workspaces/${{ inputs.workspace }}
      run: yarn install --immutable

    - name: Build dynamic plugins image
      shell: bash
      working-directory: ./workspaces/${{ inputs.workspace }}
      env:
        REGISTRY: ${{ inputs.registry }}
        TAGS: ${{ inputs.tags }}
        LABELS: ${{ inputs.labels }}
      run: |
        set -euo pipefail

        # Read the tags and labels into bash arrays (whitespace separated).
        read -ra TAG_LIST <<< "$(echo "${TAGS}" | tr '\n' ' ')"
        read -ra LABEL_LIST <<< "$(echo "${LABELS}" | tr '\n' ' ')"

        if [ "${#TAG_LIST[@]}" -eq 0 ]; then
          echo "No tags provided" >&2
          exit 1
        fi

        LABEL_ARGS=()
        for label in "${LABEL_LIST[@]}"; do
          [ -n "${label}" ] && LABEL_ARGS+=(--label "${label}")
        done

        PRIMARY_IMAGE="${REGISTRY}:${TAG_LIST[0]}"

        echo "Building ${PRIMARY_IMAGE} with rhdh-cli"
        npx @red-hat-developer-hub/cli@latest plugin package \
          --tag "${PRIMARY_IMAGE}" \
          --container-tool podman \
          "${LABEL_ARGS[@]}"

        # Add any additional tags to the freshly built image.
        for tag in "${TAG_LIST[@]:1}"; do
          echo "Tagging ${REGISTRY}:${tag}"
          podman tag "${PRIMARY_IMAGE}" "${REGISTRY}:${tag}"
        done

    - name: Push image to registry
      if: ${{ inputs.push == 'true' }}
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        TAGS: ${{ inputs.tags }}
        QUAY_USERNAME: ${{ inputs.quay_username }}
        QUAY_PASSWORD: ${{ inputs.quay_password }}
      run: |
        set -euo pipefail

        read -ra TAG_LIST <<< "$(echo "${TAGS}" | tr '\n' ' ')"

        podman login -u "${QUAY_USERNAME}" -p "${QUAY_PASSWORD}" quay.io

        for tag in "${TAG_LIST[@]}"; do
          [ -z "${tag}" ] && continue
          echo "Pushing ${REGISTRY}:${tag}"
          podman push "${REGISTRY}:${tag}"
        done
